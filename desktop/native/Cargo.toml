[package]
name = "artex-native"
version = "0.2.0-preview.3"
edition = "2024"
license = "AGPL-3.0-only"
description = "Integrated Rust desktop application for ARTEX"

[workspace]

[dependencies]
artex-native-core = { path = "../native-core" }
artex-core = { path = "../crates/core" }
artex-host = { path = "../crates/host" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "=0.26.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "=0.26.0", default-features = false, features = ["ksni"] }
zbus = { version = "4.4", default-features = false, features = ["blocking", "async-io"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"
